description:
  nl:
    shortDescription: >-
      API van het Skills register (skills.developer.overheid.nl)
    longDescription: |
      De API van het Skills-register maakt AI skills voor de overheid beter
      vindbaar en herbruikbaar. Het register harvest skills (SKILL.md) uit
      plugin-marketplaces en losse repositories en ontsluit de metadata en
      inhoud via een API, zodat ontwikkelaars en organisaties kunnen zien
      welke skills er zijn, waar ze vandaan komen en wie ze beheert.
    features:
      - Doorzoekbare catalogus van AI skills
      - Harvesten van plugin-marketplaces en losse skill-repositories

